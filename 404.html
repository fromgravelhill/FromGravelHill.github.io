<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page Not Found | From Gravel Hill Enterprises</title>
  <meta name="description" content="The page you requested could not be found.">
  <link rel="icon" href="/favicon.ico">
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0b1020;
      color: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(180deg, #0b1020, #1b2140);
    }
    main {
      width: 100%;
      max-width: 560px;
      padding: 32px;
      border: 1px solid #334155;
      border-radius: 20px;
      background: #121933;
      text-align: center;
    }
    h1 { margin: 0 0 12px; font-size: clamp(2rem, 5vw, 3rem); }
    p { line-height: 1.65; color: #cbd5e1; }
    a.home {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 18px;
      background: #7dd3fc;
      color: #08111f;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
    }
    a.home:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    footer { margin-top: 24px; font-size: .9rem; color: #94a3b8; }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Page Not Found</h1>
    <p>The page you were looking for could not be found. It may have been moved, renamed, or removed.</p>
    <a class="home" href="/">Return to From Gravel Hill Enterprises</a>
    <footer>&copy; <span id="year"></span> From Gravel Hill Enterprises &middot; <a href="https://fromgravelhill.ca/">fromgravelhill.ca</a></footer>
  </main>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
